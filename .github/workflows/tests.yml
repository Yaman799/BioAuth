name: BioAuth Tests Coverage Audit SBOM

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-fast-quality-gate:
    name: Linux fast tests, coverage, audit, and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}
      BIOAUTH_CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-pro.txt
            requirements-dev.txt
            requirements-audit.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-audit.txt

      - name: Source compile smoke
        run: python -m compileall -q .

      - name: Focused source smoke checks
        run: |
          python -B tests/run_sensitive_exception_hardening_checks.py
          python -B tests/run_deep_runtime_fallback_visibility_checks.py
          python -B tests/run_history_archive_finalization_verification_checks.py
          python -B tests/run_privacy_settings_license_ux_closure_checks.py
          python -B tests/run_license_production_policy_closure_checks.py

      - name: Pytest with coverage
        run: |
          mkdir -p reports/coverage
          python -m pytest -q \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage/coverage.xml \
            --junitxml=reports/coverage/pytest-junit.xml

      - name: Dependency audit
        run: |
          mkdir -p reports/audit
          python -m pip_audit -r requirements.txt -f json -o reports/audit/pip-audit-runtime.json
          python -m pip_audit -r requirements-pro.txt -f json -o reports/audit/pip-audit-pro.json

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p reports/sbom
          cyclonedx-py requirements requirements.txt --of JSON -o reports/sbom/bioauth-runtime.cdx.json
          cyclonedx-py requirements requirements-pro.txt --of JSON -o reports/sbom/bioauth-pro.cdx.json

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bioauth-coverage-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            reports/coverage/coverage.xml
            reports/coverage/pytest-junit.xml

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bioauth-pip-audit-${{ github.run_id }}
          if-no-files-found: warn
          path: reports/audit/*.json

      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bioauth-sbom-${{ github.run_id }}
          if-no-files-found: warn
          path: reports/sbom/*.cdx.json
