name: BioAuth Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      BIOAUTH_ENABLE_SIGNING: "1"
      BIOAUTH_UPDATE_REPO_OWNER: ${{ github.repository_owner }}
      BIOAUTH_UPDATE_REPO_NAME: ${{ github.event.repository.name }}
      BIOAUTH_TIMESTAMP_URL: http://timestamp.digicert.com
      BIOAUTH_SIGN_CERT_SHA1: ${{ secrets.BIOAUTH_SIGN_CERT_SHA1 }}
      BIOAUTH_SIGN_CERT_FILE: ${{ secrets.BIOAUTH_SIGN_CERT_FILE }}
      BIOAUTH_SIGN_CERT_PASSWORD: ${{ secrets.BIOAUTH_SIGN_CERT_PASSWORD }}
      BIOAUTH_SIGN_CERT_PFX_BASE64: ${{ secrets.BIOAUTH_SIGN_CERT_PFX_BASE64 }}
      BIOAUTH_SIGNTOOL: ${{ secrets.BIOAUTH_SIGNTOOL }}
      BIOAUTH_INCLUDE_FACE: "1"
      BIOAUTH_INCLUDE_OPENCV: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release version and channel
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "v1.0.0" }
          $version = $tag
          if ($version.StartsWith("v")) { $version = $version.Substring(1) }
          $channel = "stable"
          $buildProfile = "production"
          $prerelease = "false"
          if ($version -match "beta") {
            $channel = "beta"
            $buildProfile = "beta"
            $prerelease = "true"
          }
          "BIOAUTH_APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BIOAUTH_UPDATE_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BIOAUTH_BUILD_PROFILE=$buildProfile" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BIOAUTH_PACKAGE_PROFILE=hybrid-pro-face" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BIOAUTH_RELEASE_NOTES=BioAuth $version release." | Out-File -FilePath $env:GITHUB_ENV -Append
          "BIOAUTH_PRERELEASE=$prerelease" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt

      - name: Write packaged update configuration
        shell: pwsh
        run: |
          python build_tools\write_release_config.py `
            --owner "${{ github.repository_owner }}" `
            --repo "${{ github.event.repository.name }}" `
            --channel "$env:BIOAUTH_UPDATE_CHANNEL" `
            --manifest-name "bioauth-update.json" `
            --verification "sha256" `
            --signing-required

      - name: Configure Windows signing certificate
        shell: pwsh
        run: |
          $thumbprint = "$env:BIOAUTH_SIGN_CERT_SHA1"
          $certFile = "$env:BIOAUTH_SIGN_CERT_FILE"
          $pfxBase64 = "$env:BIOAUTH_SIGN_CERT_PFX_BASE64"
          $certPassword = "$env:BIOAUTH_SIGN_CERT_PASSWORD"
          if (-not [string]::IsNullOrWhiteSpace($thumbprint)) {
            "BIOAUTH_SIGN_CERT_SHA1=$thumbprint" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Signing certificate configured by thumbprint."
          } elseif (-not [string]::IsNullOrWhiteSpace($pfxBase64)) {
            if ([string]::IsNullOrWhiteSpace($certPassword)) { throw "BIOAUTH_SIGN_CERT_PASSWORD is required when BIOAUTH_SIGN_CERT_PFX_BASE64 is used." }
            $certPath = Join-Path $env:RUNNER_TEMP "bioauth_signing_cert.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($pfxBase64))
            "BIOAUTH_SIGN_CERT_FILE=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Signing certificate materialized to runner temp path."
          } elseif (-not [string]::IsNullOrWhiteSpace($certFile)) {
            if ([string]::IsNullOrWhiteSpace($certPassword)) { throw "BIOAUTH_SIGN_CERT_PASSWORD is required when BIOAUTH_SIGN_CERT_FILE is used." }
            "BIOAUTH_SIGN_CERT_FILE=$certFile" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Signing certificate configured by file path."
          } else {
            throw "Production signing is enabled but no BIOAUTH_SIGN_CERT_SHA1, BIOAUTH_SIGN_CERT_FILE, or BIOAUTH_SIGN_CERT_PFX_BASE64 secret is configured."
          }
          if (-not [string]::IsNullOrWhiteSpace($certPassword)) {
            "BIOAUTH_SIGN_CERT_PASSWORD=$certPassword" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Run focused release tests
        run: >-
          python -m pytest -q
          tests/test_update_client.py
          tests/test_update_manifest_generator.py
          tests/test_update_bridge_wiring.py
          tests/test_phase_15_release_background_runtime_autoupdate.py
          tests/test_developer_hybrid_pro_modality_window_feature_mapping.py
          tests/test_windows_release_smoke_signing_update_gate.py

      - name: Build Windows installer
        shell: cmd
        run: build_installer.bat

      - name: Run packaged release smoke checks
        shell: cmd
        env:
          PYNPUT_BACKEND: dummy
          QT_QPA_PLATFORM: offscreen
        run: |
          dist\BioAuth\BioAuth.exe --self-check-packaging
          dist\BioAuth\BioAuth.exe --self-check-release-readiness
          dist\BioAuth\BioAuth.exe --self-check-runtime-smoke

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path installer -Filter "BioAuthDesktopSetup_*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "BioAuth installer was not produced." }
          "path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$($installer.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($installer.Name -notmatch "^BioAuthDesktopSetup_") { throw "Unexpected installer artifact name." }

      - name: Generate update manifest and release checksums
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe build_tools\generate_update_manifest.py `
            --installer "${{ steps.installer.outputs.path }}" `
            --version "$env:BIOAUTH_APP_VERSION" `
            --channel "$env:BIOAUTH_UPDATE_CHANNEL" `
            --min-supported-version "1.0.0" `
            --release-notes "$env:BIOAUTH_RELEASE_NOTES" `
            --output bioauth-update.json `
            --sums-output SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BioAuth-${{ github.ref_name }}
          path: |
            installer/${{ steps.installer.outputs.name }}
            bioauth-update.json
            SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BioAuth ${{ env.BIOAUTH_APP_VERSION }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ env.BIOAUTH_PRERELEASE }}
          generate_release_notes: true
          files: |
            installer/${{ steps.installer.outputs.name }}
            bioauth-update.json
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
